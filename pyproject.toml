[project]
name = "courseassessgen"
version = "0.1.0"
description = "学生代码评估工具 — AI 时代的理解度验证器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cagen = "assessgen.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
